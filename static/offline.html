<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时光集 · 离线合集</title><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="gallery.js" defer></script></head>
<body class="offline"><header class="topbar"><div class="brand">时光集<span>WAYBACK LIBRARY</span></div><span class="local-label">离线合集</span></header><main>
<section id="collection"><div class="collection-heading"><div><p class="eyebrow">已保存的历史 · 离线版</p><h1 id="collection-title"></h1><p id="collection-status" class="task-badge" hidden></p><p class="hint">以下为导出时保存的任务结果；此页面不会自动继续查找。</p></div><div class="actions"><a class="secondary" href="posts.csv" download>帖子 CSV ↓</a><a class="secondary" href="missing-media.json" download>缺失清单 ↓</a></div></div><div class="stats" id="stats"></div><div id="media-inventory" class="media-inventory" hidden></div><p id="collection-note" class="coverage-note"></p><details id="coverage-details" class="coverage-details"><summary>未恢复原因与来源说明</summary><p class="hint">未恢复的文件不一定仍可找回。继续查找需回到时光集主页面；本离线合集只浏览和下载已保存内容。</p><details id="error-details" class="error-details" hidden><summary id="error-summary">本轮未完成项目</summary><ul id="error-list"></ul></details>
<div id="recovery-summary" class="recovery-summary" hidden></div><div id="discovery-records" class="recovery-summary" hidden aria-label="帖子查找记录"></div></details><div class="filters"><label class="search-box"><span>搜索</span><input id="search" type="search" placeholder="帖子内容或 ID"></label><label><span class="sr-only">内容类型</span><select id="type-filter"><option value="all">全部内容</option><option value="saved">仅已下载媒体</option><option value="saved-video">已下载视频</option><option value="image">含图片</option><option value="video">含视频</option><option value="text">仅文字 / 链接</option><option value="missing">有缺失媒体</option><option value="missing-text">未恢复正文</option></select></label><label><span class="sr-only">发帖月份</span><select id="month-filter"><option value="all">全部月份</option></select></label><label><span class="sr-only">时间排序</span><select id="sort"><option value="desc">从新到旧</option><option value="asc">从旧到新</option></select></label></div><div class="result-line"><span id="result-count"></span><span>时间统一为 UTC</span></div><div id="timeline"></div><button id="load-more" class="secondary wide" hidden>加载更多</button></section>
</main><dialog id="lightbox" aria-label="存档图片预览"><button id="close-lightbox" class="close-button" aria-label="关闭预览" autofocus>×</button><div id="lightbox-content"></div><div class="lightbox-toolbar"><button id="previous-image" class="secondary small" type="button" aria-label="上一张图片">← 上一张</button><span id="image-count" aria-live="polite"></span><button id="next-image" class="secondary small" type="button" aria-label="下一张图片">下一张 →</button><span id="image-download"></span></div><p id="image-caption" class="hint"></p><p class="lightbox-hint">浏览当前筛选结果中的已下载图片 · 可用键盘 ← → 切换，Esc 关闭</p></dialog></body></html>
